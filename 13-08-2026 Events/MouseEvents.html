    <p  ondblclick="demo()" onmousemove="test()" >This is para tag</p>
    <input type="text" name="" id="" oncontextmenu="disableRightClick()">
     <!-- oncontextmenu=""//  will not open the menu on left click  -->
   <script>
     function demo()
        {
            console.log("Demo function called when tou double clicked");
        }
        function test()
        {
            console.log("test function called when you move the mouse ");
        }
        function disableRightClick(a) {
a.preventDefault();
        }
// --------------------------------------------------------------------------------------

        let inp = document.querySelector('input') ;
        inp.onkeypress = (a) => {
            console.log("key is pressed : " + a.key)
        }

        inp.onkeydown=(a) => {
            console.log("Key is down")
        }

        inp.onkeyup=(a) => {
            console.log("Key is up")
        }
