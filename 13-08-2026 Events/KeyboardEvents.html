<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text">
  <script>
     let inp = document.querySelector('input') ;
        inp.onkeypress = (a) => {
            console.log("key is pressed : " + a.key)
        }

        inp.onkeydown=(a) => {
            console.log("Key is down")
        }

        inp.onkeyup=(a) => {
            console.log("Key is up")
        }
  </script>  
</body>
</html>
